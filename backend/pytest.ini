[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: the MCP session managers can only be started once.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    db: needs the Postgres from compose.yaml (skipped when it is not reachable)
    integration: starts real servers on local ports
addopts = -q
