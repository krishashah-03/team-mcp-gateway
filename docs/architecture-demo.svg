<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Team MCP Gateway architecture</title>
  <desc id="desc">Architecture diagram showing dashboard users, gateway authentication and authorization, chat and direct tool flows, MCP upstreams, WooCommerce, PostgreSQL, and Kubernetes deployment boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4169d8"/></marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #17243a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52627a; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 12px; fill: #52627a; }
      .tiny { font-size: 11px; fill: #52627a; }
      .box { stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #52627a; stroke-width: 2; marker-end: url(#arrow); }
      .edgeBlue { fill: none; stroke: #4169d8; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f4f7fb"/>
  <text x="48" y="52" class="title">Team MCP Gateway — demo architecture</text>
  <text x="48" y="80" class="subtitle">Application request flow, security boundaries, and Kubernetes deployment shape</text>

  <!-- Application request flow -->
  <rect x="36" y="108" width="1528" height="535" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="145" class="section">1. Application and request flow</text>

  <!-- Actors and dashboard -->
  <rect x="68" y="190" width="150" height="70" class="box" fill="#eef2ff" stroke="#8897e8"/>
  <text x="143" y="220" text-anchor="middle" class="label">Admin</text>
  <text x="143" y="241" text-anchor="middle" class="small">manage team and servers</text>
  <rect x="68" y="300" width="150" height="70" class="box" fill="#eef2ff" stroke="#8897e8"/>
  <text x="143" y="330" text-anchor="middle" class="label">Member</text>
  <text x="143" y="351" text-anchor="middle" class="small">use permitted tools</text>
  <rect x="68" y="420" width="150" height="70" class="box" fill="#f3f4f6" stroke="#9aa5b1"/>
  <text x="143" y="450" text-anchor="middle" class="label">MCP client</text>
  <text x="143" y="471" text-anchor="middle" class="small">gateway API key</text>

  <rect x="270" y="180" width="245" height="235" rx="15" fill="#f8faff" stroke="#8ca4e8" stroke-width="1.5"/>
  <text x="392" y="210" text-anchor="middle" class="label">React dashboard</text>
  <rect x="292" y="232" width="200" height="58" class="box" fill="#eaf1ff" stroke="#9bb3f0"/>
  <text x="392" y="257" text-anchor="middle" class="label">Administration</text>
  <text x="392" y="276" text-anchor="middle" class="small">servers · team · permissions</text>
  <rect x="292" y="307" width="200" height="42" class="box" fill="#eaf1ff" stroke="#9bb3f0"/>
  <text x="392" y="333" text-anchor="middle" class="label">Tools · Run tool</text>
  <rect x="292" y="361" width="200" height="42" class="box" fill="#eaf1ff" stroke="#9bb3f0"/>
  <text x="392" y="387" text-anchor="middle" class="label">Chat</text>

  <!-- Gateway boundary -->
  <rect x="565" y="170" width="590" height="350" rx="18" fill="#f0f7ff" stroke="#5b91ce" stroke-width="2"/>
  <text x="590" y="202" class="label">FastAPI gateway</text>
  <text x="590" y="224" class="small">Public API boundary · identity follows the signed-in user or API key</text>
  <rect x="592" y="250" width="155" height="64" class="box" fill="#ffffff" stroke="#7ba7d8"/>
  <text x="669" y="277" text-anchor="middle" class="label">Authenticate</text>
  <text x="669" y="298" text-anchor="middle" class="small">JWT / gateway key</text>
  <rect x="780" y="250" width="155" height="64" class="box" fill="#ffffff" stroke="#7ba7d8"/>
  <text x="857" y="277" text-anchor="middle" class="label">Authorize</text>
  <text x="857" y="298" text-anchor="middle" class="small">role and tool rules</text>
  <rect x="968" y="250" width="155" height="64" class="box" fill="#ffffff" stroke="#7ba7d8"/>
  <text x="1045" y="277" text-anchor="middle" class="label">Tool router</text>
  <text x="1045" y="298" text-anchor="middle" class="small">namespaced tool names</text>
  <rect x="606" y="365" width="220" height="90" class="box" fill="#ffffff" stroke="#7ba7d8"/>
  <text x="716" y="394" text-anchor="middle" class="label">Direct tool call</text>
  <text x="716" y="416" text-anchor="middle" class="small">dashboard → permission → MCP</text>
  <text x="716" y="437" text-anchor="middle" class="small">no model call</text>
  <rect x="858" y="365" width="265" height="90" class="box" fill="#ffffff" stroke="#7ba7d8"/>
  <text x="990" y="394" text-anchor="middle" class="label">Chat tool loop</text>
  <text x="990" y="416" text-anchor="middle" class="small">model selects tool → permission check</text>
  <text x="990" y="437" text-anchor="middle" class="small">result returns to model and user</text>

  <!-- Upstreams and external services -->
  <rect x="1210" y="184" width="315" height="265" rx="16" fill="#f1fbf4" stroke="#70ad80" stroke-width="1.5"/>
  <text x="1367" y="214" text-anchor="middle" class="label">Internal MCP upstreams</text>
  <rect x="1235" y="237" width="125" height="62" class="box" fill="#ffffff" stroke="#78ad84"/>
  <text x="1297" y="263" text-anchor="middle" class="label">WooCommerce</text>
  <text x="1297" y="283" text-anchor="middle" class="small">MCP server</text>
  <rect x="1380" y="237" width="120" height="62" class="box" fill="#ffffff" stroke="#78ad84"/>
  <text x="1440" y="263" text-anchor="middle" class="label">Utilities</text>
  <text x="1440" y="283" text-anchor="middle" class="small">MCP server</text>
  <rect x="1307" y="324" width="125" height="62" class="box" fill="#ffffff" stroke="#78ad84"/>
  <text x="1369" y="350" text-anchor="middle" class="label">Docs search</text>
  <text x="1369" y="370" text-anchor="middle" class="small">MCP server</text>
  <text x="1367" y="422" text-anchor="middle" class="tiny">Gateway calls upstreams over internal MCP transport</text>
  <rect x="1235" y="480" width="250" height="58" class="box" fill="#fff8e8" stroke="#d2a84e"/>
  <text x="1360" y="505" text-anchor="middle" class="label">WooCommerce REST API</text>
  <text x="1360" y="525" text-anchor="middle" class="small">Woo MCP uses store credentials</text>

  <rect x="610" y="555" width="220" height="55" class="box" fill="#fff8e8" stroke="#d2a84e"/>
  <text x="720" y="580" text-anchor="middle" class="label">Gemini / OpenRouter</text>
  <text x="720" y="599" text-anchor="middle" class="small">optional model provider</text>
  <rect x="890" y="555" width="250" height="55" class="box" fill="#f7f1ff" stroke="#9a80c9"/>
  <text x="1015" y="580" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1015" y="599" text-anchor="middle" class="small">gateway metadata, permissions, audit</text>

  <!-- Flow lines -->
  <path d="M218 225 H252 V261 H292" class="edge"/>
  <path d="M218 335 H252 V328 H292" class="edge"/>
  <path d="M218 455 H540 V281 H592" class="edge"/>
  <text x="370" y="446" class="tiny">MCP request</text>
  <path d="M492 328 H544 V391 H606" class="edgeBlue"/>
  <path d="M492 382 H544 V407 H858" class="edgeBlue"/>
  <path d="M747 282 H780" class="edge"/>
  <path d="M935 282 H968" class="edge"/>
  <path d="M826 410 H1045 V314" class="edgeBlue"/>
  <path d="M1123 410 H1175 V268 H1235" class="edgeBlue"/>
  <path d="M1123 410 H1175 V355 H1307" class="edgeBlue"/>
  <path d="M1297 299 V480" class="edge"/>
  <path d="M990 455 V520 H720 V555" class="edge dashed"/>
  <path d="M857 314 V535 H1015 V555" class="edge dashed"/>
  <text x="854" y="544" class="tiny">identity, registrations, and audit records</text>

  <!-- Kubernetes deployment -->
  <rect x="36" y="670" width="1528" height="405" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="708" class="section">2. Kubernetes deployment shape</text>
  <text x="62" y="733" class="small">Helm release namespace is selected at install time · internal Services connect application pods</text>

  <rect x="82" y="770" width="1436" height="250" rx="18" fill="#f8fafc" stroke="#8092aa" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="108" y="801" class="label">Kubernetes cluster · selected Helm namespace</text>

  <rect x="112" y="843" width="175" height="93" class="box" fill="#eef2ff" stroke="#8897e8"/>
  <text x="199" y="875" text-anchor="middle" class="label">Optional Ingress</text>
  <text x="199" y="899" text-anchor="middle" class="small">host and TLS reference</text>
  <text x="199" y="919" text-anchor="middle" class="tiny">public entry when enabled</text>

  <rect x="350" y="843" width="190" height="93" class="box" fill="#eaf1ff" stroke="#7f9fe1"/>
  <text x="445" y="875" text-anchor="middle" class="label">Web Deployment</text>
  <text x="445" y="899" text-anchor="middle" class="small">nginx :8080</text>
  <text x="445" y="919" text-anchor="middle" class="tiny">dashboard + API proxy</text>

  <rect x="605" y="825" width="220" height="128" class="box" fill="#eaf5ff" stroke="#5b91ce"/>
  <text x="715" y="858" text-anchor="middle" class="label">Gateway Deployment</text>
  <text x="715" y="882" text-anchor="middle" class="small">FastAPI :8000</text>
  <text x="715" y="904" text-anchor="middle" class="tiny">readiness/liveness probes</text>
  <text x="715" y="924" text-anchor="middle" class="tiny">CPU/memory requests and limits</text>

  <rect x="892" y="825" width="290" height="128" class="box" fill="#effaf3" stroke="#70ad80"/>
  <text x="1037" y="854" text-anchor="middle" class="label">Internal MCP Deployments</text>
  <text x="1037" y="880" text-anchor="middle" class="small">Woo :8001 · Utilities :8003</text>
  <text x="1037" y="901" text-anchor="middle" class="small">Docs search :8004</text>
  <text x="1037" y="927" text-anchor="middle" class="tiny">not public ingress targets</text>

  <rect x="1245" y="825" width="220" height="128" class="box" fill="#f7f1ff" stroke="#9a80c9"/>
  <text x="1355" y="858" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1355" y="882" text-anchor="middle" class="small">StatefulSet + Service :5432</text>
  <text x="1355" y="904" text-anchor="middle" class="small">PersistentVolumeClaim</text>
  <text x="1355" y="927" text-anchor="middle" class="tiny">gateway-managed data</text>

  <rect x="610" y="974" width="230" height="35" rx="8" fill="#fff8e8" stroke="#d2a84e"/>
  <text x="725" y="997" text-anchor="middle" class="small">Migration Job · schema upgrades</text>
  <rect x="894" y="974" width="288" height="35" rx="8" fill="#fff8e8" stroke="#d2a84e"/>
  <text x="1038" y="997" text-anchor="middle" class="small">Kubernetes Secret references · values hidden</text>

  <path d="M287 889 H350" class="edgeBlue"/>
  <path d="M540 889 H605" class="edgeBlue"/>
  <path d="M825 889 H892" class="edge"/>
  <path d="M715 953 V962 H1355 V953" class="edge"/>
  <path d="M1038 953 V974" class="edge dashed"/>

  <rect x="110" y="1032" width="1380" height="25" rx="7" fill="#fff4e8"/>
  <text x="800" y="1050" text-anchor="middle" class="tiny">Chart intent only: Ingress is optional; reviewed NetworkPolicies restrict ingress paths, not egress. Secret values must never appear in the demo.</text>
</svg>
